{% comment %}
  One small video frame for the action timeline. Variables:
  hx, hy (hand offset), cx, cy (cup offset), hex (segment colour), label, frame
{% endcomment %}
<figure class="min-w-0">
  <div class="relative overflow-hidden rounded-lg ring-1 ring-white/10" style="box-shadow: inset 0 0 0 1px {{ hex }}33">
    <svg viewBox="0 0 160 100" class="block w-full" aria-hidden="true">
      <rect width="160" height="100" fill="#1e2923"/>
      <path d="M0 56 L160 50 L160 100 L0 100 Z" fill="#2f3a34"/>
      <path d="M108 72 L150 69 L156 86 L112 90 Z" fill="#444f49"/>
      <g transform="translate({{ cx|default:0 }} {{ cy|default:0 }})">
        <ellipse cx="77" cy="60" rx="9" ry="1.8" fill="#02130c" opacity=".35"/>
        <path d="M70 41 L84 41 L83 58 Q83 60 81 60 L73 60 Q71 60 71 58 Z" fill="#e1ece6"/>
        <path d="M84 45 C89 45 89 54 83.5 55" fill="none" stroke="#cdd8d2" stroke-width="1.8"/>
        <ellipse cx="77" cy="41" rx="7" ry="1.9" fill="#f5f8f6"/>
        <rect x="66.5" y="36.5" width="21" height="27" rx="1" fill="none" stroke="{{ hex }}" stroke-width="1.2" stroke-dasharray="3 2"/>
      </g>
      <g transform="translate({{ hx|default:0 }} {{ hy|default:0 }})">
        <path d="M18 104 C 30 88, 42 76, 54 67" fill="none" stroke="#9aa59f" stroke-width="12" stroke-linecap="round"/>
        <ellipse cx="60" cy="61" rx="8.5" ry="6.5" transform="rotate(-36 60 61)" fill="#b3beb8"/>
        <g stroke="#c7d2cc" stroke-linecap="round" stroke-width="3">
          <path d="M64 56 L71 50"/><path d="M66 59 L72 54"/><path d="M66 62 L71.5 58.5"/><path d="M57 55 L61 48.5"/>
        </g>
        <g fill="#f472b6"><circle cx="54" cy="67" r="1.6"/><circle cx="60" cy="61" r="1.6"/><circle cx="71" cy="50" r="1.3"/><circle cx="72" cy="54" r="1.3"/><circle cx="61" cy="48.5" r="1.3"/></g>
      </g>
    </svg>
    <span class="absolute top-1 left-1 rounded bg-ink-950/75 px-1 py-px font-mono text-[8.5px] text-slate-400">f {{ frame }}</span>
  </div>
  <figcaption class="mt-1.5 flex items-center gap-1.5 font-mono text-[10px] text-slate-400"><span class="h-1.5 w-1.5 rounded-full" style="background: {{ hex }}"></span>{{ label }}</figcaption>
</figure>
