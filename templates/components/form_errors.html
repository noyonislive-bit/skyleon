{% if lockout %}
  <div class="alert alert-error mb-5" role="alert">
    {% icon "alert-circle" class="mt-0.5 h-4 w-4 shrink-0" %}
    <div><p>{{ lockout }}</p></div>
  </div>
{% endif %}
{% if form.non_field_errors %}
  <div class="alert alert-error mb-5" role="alert">
    {% icon "alert-circle" class="mt-0.5 h-4 w-4 shrink-0" %}
    <div>{% for e in form.non_field_errors %}<p>{{ e }}</p>{% endfor %}</div>
  </div>
{% endif %}
