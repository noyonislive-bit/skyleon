<h1 class="mt-6 text-3xl font-semibold tracking-tight">পাসওয়ার্ড সেভ হয়েছে</h1>

<a href="{% url 'accounts:login' %}" class="btn btn-primary mt-8 w-full">লগইন করুন</a>
{% endblock %}
