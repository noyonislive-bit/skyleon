{% extends "layouts/auth.html" %}
{% block title %}Password saved · {{ brand.name }}{% endblock %}
{% block content %}
<div class="flex h-12 w-12 items-center justify-center rounded-xl bg-emerald-50 text-emerald-600 ring-1 ring-emerald-200">{% icon "check-circle-2" class="h-6 w-6" %}</div>
<h1 class="mt-6 text-3xl font-semibold tracking-tight">Password saved</h1>
<p class="mt-3 text-sm text-slate-600">You can now sign in with your new password.</p>
<a href="{% url 'accounts:login' %}" class="btn btn-primary mt-8 w-full">Sign in</a>
{% endblock %}
