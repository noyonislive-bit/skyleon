<!doctype html>
<html lang="{% block lang %}en{% endblock %}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#ecf1ee;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#34423b">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ecf1ee;padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px">
        <tr><td style="padding:0 4px 16px">
          <span style="display:inline-block;width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#13ad69,#a8e04a);vertical-align:middle"></span>
          <span style="font-size:17px;font-weight:600;color:#121c17;vertical-align:middle;margin-left:8px">{{ brand.name }}</span>
        </td></tr>
        <tr><td style="background:#ffffff;border-radius:14px;border:1px solid #dce4df;padding:32px">
          {% block content %}{% endblock %}
        </td></tr>
        <tr><td style="padding:20px 4px;font-size:12px;line-height:18px;color:#91a199">
          {{ brand.legal_name }} · {{ brand.tagline }}<br>
          {% if company.email %}<a href="mailto:{{ company.email }}" style="color:#63746b">{{ company.email }}</a> · {% endif %}<a href="{{ APP_URL }}" style="color:#63746b">{{ APP_URL }}</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body></html>
